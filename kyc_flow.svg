<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="730" viewBox="0 0 1000 730" font-family="'Apple SD Gothic Neo','Malgun Gothic','Noto Sans CJK KR','Nanum Gothic','AppleGothic',sans-serif">
  <defs>
    <marker id="arw" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 z" fill="#555"/>
    </marker>
    <style>
      .lbl{fill:#333;font-size:13px;}
      .edge{fill:#777;font-size:12px;font-weight:bold;}
      .bt{font-size:14px;font-weight:bold;}
      .sm{font-size:12px;}
      text{dominant-baseline:middle;}
    </style>
  </defs>

  <!-- title -->
  <text x="500" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#111">법인 업무 처리 — 한 장 의사결정 흐름</text>
  <text x="500" y="52" text-anchor="middle" font-size="12" fill="#888">실명확인은 항상 먼저 · KYC는 "대상 업무 + KYC 만료"일 때만</text>

  <!-- START -->
  <rect x="405" y="66" width="190" height="42" rx="21" fill="#eceff1" stroke="#90a4ae"/>
  <text x="500" y="88" text-anchor="middle" class="bt" fill="#37474f">거래 요청 들어옴</text>
  <line x1="500" y1="108" x2="500" y2="132" stroke="#555" stroke-width="2" marker-end="url(#arw)"/>

  <!-- STEP1 실명확인 -->
  <rect x="350" y="134" width="300" height="56" rx="10" fill="#e3f2fd" stroke="#1e88e5" stroke-width="2"/>
  <text x="500" y="153" text-anchor="middle" class="bt" fill="#0d47a1">STEP 1 · 실명확인 (항상 수행)</text>
  <text x="500" y="173" text-anchor="middle" class="sm" fill="#1565c0">신분증·셀피/계좌인증·사업자등록증명원·등기부</text>
  <line x1="500" y1="190" x2="500" y2="222" stroke="#555" stroke-width="2" marker-end="url(#arw)"/>

  <!-- Diamond 1 -->
  <polygon points="500,224 600,292 500,360 400,292" fill="#fff8e1" stroke="#f9a825" stroke-width="2"/>
  <text x="500" y="285" text-anchor="middle" class="bt" fill="#5d4037">이 업무가</text>
  <text x="500" y="303" text-anchor="middle" class="bt" fill="#5d4037">KYC 대상인가?</text>

  <!-- D1 No -> left green box A -->
  <line x1="400" y1="292" x2="300" y2="292" stroke="#555" stroke-width="2" marker-end="url(#arw)"/>
  <text x="350" y="280" text-anchor="middle" class="edge">아니오</text>
  <rect x="50" y="258" width="250" height="68" rx="10" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2"/>
  <text x="175" y="282" text-anchor="middle" class="bt" fill="#1b5e20">① BO 가</text>
  <text x="175" y="302" text-anchor="middle" class="sm" fill="#2e7d32">실명확인만 심사 → 완료</text>

  <!-- D1 Yes -> down -->
  <line x1="500" y1="360" x2="500" y2="392" stroke="#555" stroke-width="2" marker-end="url(#arw)"/>
  <text x="516" y="378" class="edge">예</text>

  <!-- Diamond 2 -->
  <polygon points="500,394 600,462 500,530 400,462" fill="#fff8e1" stroke="#f9a825" stroke-width="2"/>
  <text x="500" y="455" text-anchor="middle" class="bt" fill="#5d4037">기존 KYC가</text>
  <text x="500" y="473" text-anchor="middle" class="bt" fill="#5d4037">아직 유효한가?</text>

  <!-- D2 Yes -> left green box B (gray zone) -->
  <line x1="400" y1="462" x2="300" y2="462" stroke="#555" stroke-width="2" marker-end="url(#arw)"/>
  <text x="350" y="450" text-anchor="middle" class="edge">예(유효)</text>
  <rect x="40" y="420" width="260" height="84" rx="10" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2" stroke-dasharray="6 3"/>
  <text x="170" y="443" text-anchor="middle" class="bt" fill="#1b5e20">② KYC 건너뜀 (pass)</text>
  <text x="170" y="463" text-anchor="middle" class="sm" fill="#2e7d32">BO 가 실명확인만 심사 → 완료</text>
  <rect x="92" y="476" width="156" height="20" rx="10" fill="#ffcdd2"/>
  <text x="170" y="487" text-anchor="middle" class="sm" fill="#b71c1c" font-weight="bold">⚠ 회색지대 (R&amp;R 논의중)</text>

  <!-- D2 No -> down orange box C -->
  <line x1="500" y1="530" x2="500" y2="566" stroke="#555" stroke-width="2" marker-end="url(#arw)"/>
  <text x="516" y="550" class="edge">아니오 (만료/없음)</text>
  <rect x="360" y="568" width="280" height="78" rx="10" fill="#fff3e0" stroke="#ef6c00" stroke-width="2"/>
  <text x="500" y="592" text-anchor="middle" class="bt" fill="#e65100">③ KYC팀 이</text>
  <text x="500" y="612" text-anchor="middle" class="sm" fill="#ef6c00">KYC + 실명확인 모두 심사</text>
  <text x="500" y="630" text-anchor="middle" class="sm" fill="#ef6c00">→ 완료</text>

  <!-- Examples panel -->
  <rect x="668" y="120" width="312" height="430" rx="10" fill="#fafafa" stroke="#ddd"/>
  <text x="684" y="142" font-size="14" font-weight="bold" fill="#444">어떤 업무가 어디로 가나</text>

  <rect x="684" y="156" width="14" height="14" rx="3" fill="#e8f5e9" stroke="#2e7d32"/>
  <text x="706" y="164" class="bt" fill="#1b5e20">① 실명확인만 · BO</text>
  <text x="690" y="184" class="sm" fill="#555">· 인증수단 발급(인증서·OTP)</text>
  <text x="690" y="202" class="sm" fill="#555">· 입금계좌지정 / 한도 증액</text>
  <text x="690" y="220" class="sm" fill="#555">· 계좌비번 초기화 / 잔액증명서</text>
  <text x="690" y="238" class="sm" fill="#555">· 전자금융서비스 해지</text>

  <rect x="684" y="262" width="14" height="14" rx="3" fill="#e8f5e9" stroke="#2e7d32" stroke-dasharray="3 2"/>
  <text x="706" y="270" class="bt" fill="#1b5e20">② KYC 유효 · BO (회색지대)</text>
  <text x="690" y="290" class="sm" fill="#555">· KYC 유효기간 내 추가 계좌개설</text>
  <text x="690" y="308" class="sm" fill="#555">· (KYC 유효 시) 상품 신규</text>
  <text x="690" y="330" class="sm" fill="#b71c1c">→ 같은 메뉴인데 ③과 갈림!</text>

  <rect x="684" y="356" width="14" height="14" rx="3" fill="#fff3e0" stroke="#ef6c00"/>
  <text x="706" y="364" class="bt" fill="#e65100">③ KYC + 실명확인 · KYC팀</text>
  <text x="690" y="384" class="sm" fill="#555">· 최초 계좌개설</text>
  <text x="690" y="402" class="sm" fill="#555">· KYC 만료 후 상품 신규</text>
  <text x="690" y="420" class="sm" fill="#555">· 법인명 / 대표자명 변경</text>
  <text x="690" y="438" class="sm" fill="#555">· KYC 재이행 주기 도래</text>

  <line x1="684" y1="462" x2="964" y2="462" stroke="#eee"/>
  <text x="684" y="482" class="sm" fill="#999">💡 ②의 분기(KYC 유효?)가</text>
  <text x="684" y="500" class="sm" fill="#999">모든 혼란의 근원. ②를 BO로</text>
  <text x="684" y="518" class="sm" fill="#999">확정하면 회색지대가 사라짐.</text>

  <!-- legend -->
  <rect x="50" y="668" width="16" height="16" rx="3" fill="#e8f5e9" stroke="#2e7d32"/>
  <text x="74" y="677" class="lbl">초록 = BO 담당</text>
  <rect x="210" y="668" width="16" height="16" rx="3" fill="#fff3e0" stroke="#ef6c00"/>
  <text x="234" y="677" class="lbl">주황 = KYC팀 담당</text>
  <rect x="390" y="668" width="16" height="16" rx="3" fill="#fff8e1" stroke="#f9a825"/>
  <text x="414" y="677" class="lbl">노랑 = 판단(분기)</text>
  <rect x="560" y="668" width="16" height="16" rx="3" fill="#e3f2fd" stroke="#1e88e5"/>
  <text x="584" y="677" class="lbl">파랑 = 모든 거래 공통(실명확인)</text>
</svg>
